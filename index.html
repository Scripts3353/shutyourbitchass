<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Really unbl0ck3d</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial;background:#000;color:#0f0;padding:15px}
    h1{text-align:center;color:#0f0;text-shadow:0 0 10px #0f0;margin:10px 0}
    .in{display:flex;gap:10px;margin:15px 0}
    input{flex:1;padding:12px;background:#111;border:1px solid #0f0;color:#0f0;border-radius:6px}
    button{padding:12px 18px;background:#0f0;color:#000;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
    button:hover{background:#0c0}
    iframe{width:100%;height:70vh;border:1px solid #0f0;border-radius:6px;background:#fff;margin-top:10px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
    .card{background:#111;padding:12px;border-radius:6px;text-align:center;border:1px solid #0f0}
    .card button{width:100%;margin-top:8px}
    .ev{background:#111;padding:15px;border-radius:6px;margin-top:20px;border:1px solid #0f0}
    .ev label{display:block;margin:6px 0}
    .panic{color:#f00;font-size:11px}
    .status{text-align:center;color:#ff0;font-size:12px;margin:8px 0;background:#111;padding:6px;border-radius:6px}
    .proxy-btn{background:#333;color:#0f0;border:1px solid #0f0;margin-top:10px;width:100%;padding:12px}
    .proxy-btn:hover{background:#444}
    .toggle{margin-top:10px;color:#aaa;font-size:11px}
  </style>
</head>
<body>
  <h1>Really unbl0ck3d</h1>
  <p class="status" id="status">Proxy: corsproxy.io (1/11) – Click "GO" to load</p>

  <div class="grid">
    <div class="card"><b>TikTok</b><button onclick="go('https://tiktok.com')">OPEN</button></div>
    <div class="card"><b>Krunker</b><button onclick="go('https://krunker.io')">PLAY</button></div>
    <div class="card"><b>Shell Shockers</b><button onclick="go('https://shellshock.io')">PLAY</button></div>
    <div class="card"><b>1v1.LOL</b><button onclick="go('https://1v1.lol')">PLAY</button></div>
    <div class="card"><b>Roblox</b><button onclick="go('https://roblox.com')">PLAY</button></div>
    <div class="card"><b>YouTube</b><button onclick="go('https://youtube.com')">WATCH</button></div>
    <div class="card"><b>Custom</b><button onclick="document.getElementById('u').focus()">URL</button></div>
  </div>

  <div class="in">
    <input id="u" placeholder="https://tiktok.com or any site" />
    <button onclick="go(document.getElementById('u').value)">GO</button>
  </div>
  <iframe id="f" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>

  <div class="ev">
    <label><input type="checkbox" onchange="this.checked?document.title='Google Classroom':document.title='Really unbl0ck3d'"> Disguise Tab</label>
    <label><input type="checkbox" onchange="window.onbeforeunload=this.checked?()=>confirm('Leave?'):null"> Anti-Close</label>
    <label>Panic: <span class="panic">ESC → Khan Academy</span></label>
    <button style="background:#f00;color:#fff;width:100%;margin-top:8px" onclick="f.src='about:blank';u.value=''">CLEAR</button>
  </div>

  <!-- PROXY SWITCHER BUTTON -->
  <button class="proxy-btn" onclick="changeProxy()">CHANGE PROXY → <span id="current-proxy">corsproxy.io</span> (1/11)</button>
  <div class="toggle">
    <label><input type="checkbox" id="autoToggle" onchange="autoSwitchEnabled=this.checked"> Enable Auto-Switch (on error)</label>
  </div>

  <script>
    document.addEventListener('keydown', e => e.key === 'Escape' && (location.href = 'https://khanacademy.org'));

    // 11 WORKING PROXIES
    const proxies = [
      { name: "corsproxy.io", url: "https://corsproxy.io/?" },
      { name: "codetabs", url: "https://api.codetabs.com/v1/proxy?quest=" },
      { name: "bridged.cc", url: "https://cors.bridged.cc/?" },
      { name: "github.io", url: "https://corsproxy.github.io/?" },
      { name: "cors.lol", url: "https://cors.lol/" },
      { name: "herokuapp", url: "https://cors-anywhere.herokuapp.com/" },
      { name: "allorigins", url: "https://api.allorigins.win/raw?url=" },
      { name: "htldriven", url: "https://cors.htldriven.com/?url=" },
      { name: "thingproxy", url: "https://thingproxy.freeboard.io/fetch/" },
      { name: "corsproxy.com", url: "https://corsproxy.com/?" },
      { name: "corsfix", url: "https://corsfix.com/api/v1/proxy?apiKey=temp_public&url=" }
    ];

    let currentIndex = 0;
    let currentUrl = '';
    let autoSwitchEnabled = false;

    function updateStatus() {
      document.getElementById('status').textContent = `Proxy: ${proxies[currentIndex].name} (${currentIndex + 1}/11)`;
      document.getElementById('current-proxy').textContent = `${proxies[currentIndex].name} (${currentIndex + 1}/11)`;
    }

    function go(url) {
      if (!url) return;
      if (!url.startsWith('http')) url = 'https://' + url;
      currentUrl = url;
      document.getElementById('u').value = url;
      loadWithCurrentProxy();
    }

    function loadWithCurrentProxy() {
      const iframe = document.getElementById('f');
      const proxy = proxies[currentIndex];
      let proxyUrl = proxy.url + encodeURIComponent(currentUrl);

      // Format fixes
      if (proxy.name === 'allorigins') proxyUrl = proxy.url + encodeURIComponent(currentUrl);
      else if (proxy.name === 'cors.lol') proxyUrl = proxy.url + currentUrl.replace(/^https?:\/\//, '');
      else if (proxy.name === 'thingproxy') proxyUrl = proxy.url + currentUrl;

      iframe.src = proxyUrl;
      updateStatus();
      document.getElementById('status').textContent += ' – Loading...';

      // ONLY AUTO-SWITCH IF TOGGLE IS ON
      if (autoSwitchEnabled) {
        setTimeout(() => {
          try {
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            const body = (doc.body?.innerText || '').toLowerCase();
            if (!doc.body || body.includes('error') || body.includes('timeout') || body.includes('blocked') || body.length < 50) {
              changeProxy();
            } else {
              document.getElementById('status').textContent = `Loaded with ${proxies[currentIndex].name}`;
            }
          } catch (e) {
            changeProxy();
          }
        }, 4000);
      }
    }

    function changeProxy() {
      currentIndex = (currentIndex + 1) % proxies.length;
      if (currentUrl) {
        loadWithCurrentProxy();
      } else {
        updateStatus();
      }
    }

    // Init
    updateStatus();
  </script>
</body>
</html>
