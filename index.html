<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Really unbl0ck3d</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Arial;background:#000;color:#0f0;padding:15px}
    h1{text-align:center;color:#0f0;text-shadow:0 0 10px #0f0;margin:10px 0}
    .in{display:flex;gap:10px;margin:15px 0}
    input{flex:1;padding:12px;background:#111;border:1px solid #0f0;color:#0f0;border-radius:6px}
    button{padding:12px 18px;background:#0f0;color:#000;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
    button:hover{background:#0c0}
    iframe{width:100%;height:70vh;border:1px solid #0f0;border-radius:6px;background:#fff;margin-top:10px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
    .card{background:#111;padding:12px;border-radius:6px;text-align:center;border:1px solid #0f0}
    .card button{width:100%;margin-top:8px}
    .ev{background:#111;padding:15px;border-radius:6px;margin-top:20px;border:1px solid #0f0}
    .ev label{display:block;margin:6px 0}
    .panic{color:#f00;font-size:11px}
    .note{color:#0f0;font-size:12px;text-align:center;margin:10px 0;background:#111;padding:8px;border-radius:6px}
    .status{text-align:center;color:#ff0;font-size:11px;margin:5px 0}
  </style>
</head>
<body>
  <h1>Really unbl0ck3d</h1>
  <p class="note"><b>FALLBACK PROXIES!</b> Tries 10+ proxies if one fails – works for TikTok, games, everything.</p>

  <div class="grid">
    <div class="card"><b>TikTok</b><button onclick="go('https://tiktok.com')">OPEN</button></div>
    <div class="card"><b>Krunker</b><button onclick="go('https://krunker.io')">PLAY</button></div>
    <div class="card"><b>Shell Shockers</b><button onclick="go('https://shellshock.io')">PLAY</button></div>
    <div class="card"><b>1v1.LOL</b><button onclick="go('https://1v1.lol')">PLAY</button></div>
    <div class="card"><b>Roblox</b><button onclick="go('https://roblox.com')">PLAY</button></div>
    <div class="card"><b>YouTube</b><button onclick="go('https://youtube.com')">WATCH</button></div>
    <div class="card"><b>Custom</b><button onclick="document.getElementById('u').focus()">URL</button></div>
  </div>

  <div class="in">
    <input id="u" placeholder="https://tiktok.com or any site" />
    <button onclick="go(document.getElementById('u').value)">GO</button>
  </div>
  <p class="status" id="status">Ready – Enter URL</p>
  <iframe id="f" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>

  <div class="ev">
    <label><input type="checkbox" onchange="this.checked?document.title='Google Classroom':document.title='Really unbl0ck3d'"> Disguise Tab</label>
    <label><input type="checkbox" onchange="window.onbeforeunload=this.checked?()=>confirm('Leave?'):null"> Anti-Close</label>
    <label>Panic: <span class="panic">ESC → Khan Academy</span></label>
    <button style="background:#f00;color:#fff;width:100%;margin-top:8px" onclick="f.src='about:blank';u.value='';status.textContent='Ready – Enter URL'">CLEAR</button>
  </div>

  <script>
    document.addEventListener('keydown', e => e.key === 'Escape' && (location.href = 'https://khanacademy.org'));

    // 10+ FALLBACK PROXIES (2025 WORKING – TRY NEXT ON FAIL)
    const proxies = [
      'https://corsproxy.io/?',
      'https://api.codetabs.com/v1/proxy?quest=',
      'https://cors.bridged.cc/?',
      'https://corsproxy.github.io/?',
      'https://cors.lol/',
      'https://cors-anywhere.herokuapp.com/',
      'https://allorigins.win/get?url=',
      'https://cors.htldriven.com/?url=',
      'https://thingproxy.freeboard.io/fetch/',
      'https://corsproxy.com/?',
      'https://corsfix.com/api/v1/proxy?apiKey=temp_public&url='
    ];

    let currentProxyIndex = 0;
    let targetUrl = '';

    function go(url) {
      if (!url) return;
      if (!url.startsWith('http')) url = 'https://' + url;
      targetUrl = url;
      currentProxyIndex = 0;
      document.getElementById('status').textContent = 'Trying proxy 1/11...';
      loadNextProxy();
      document.getElementById('u').value = url;
    }

    function loadNextProxy() {
      const iframe = document.getElementById('f');
      const encoded = encodeURIComponent(targetUrl);
      let proxyUrl = proxies[currentProxyIndex] + encoded;

      // Fix formats for specific proxies
      if (proxies[currentProxyIndex].includes('allorigins')) {
        proxyUrl = proxies[currentProxyIndex].replace('get?url=', 'raw?url=') + encoded;
      } else if (proxies[currentProxyIndex].includes('cors.lol')) {
        proxyUrl = proxies[currentProxyIndex] + targetUrl.replace('https://', '').replace('http://', '');
      } else if (proxies[currentProxyIndex].includes('thingproxy')) {
        proxyUrl = proxies[currentProxyIndex] + targetUrl;
      } else if (proxies[currentProxyIndex].includes('corsfix')) {
        proxyUrl = proxies[currentProxyIndex] + encoded;
      }

      iframe.src = proxyUrl;
      currentProxyIndex++;

      // Check for failure after 3s & switch
      setTimeout(() => {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          const bodyText = doc.body.innerText.toLowerCase();
          if (!doc || bodyText.includes('error') || bodyText.includes('timeout') || bodyText.includes('blocked') || bodyText.includes('cors') || iframe.src.includes('herokuapp') && bodyText.length < 100) {
            if (currentProxyIndex < proxies.length) {
              document.getElementById('status').textContent = `Proxy 1 failed – Trying ${currentProxyIndex + 1}/11...`;
              loadNextProxy();
            } else {
              document.getElementById('status').textContent = 'All proxies failed – Try again or use mobile data.';
            }
          } else {
            document.getElementById('status').textContent = `Loaded with proxy ${currentProxyIndex}/11 – Success!`;
          }
        } catch (e) {
          if (currentProxyIndex < proxies.length) {
            loadNextProxy();
          } else {
            document.getElementById('status').textContent = 'All proxies failed – Check connection.';
          }
        }
      }, 3000);
    }
  </script>
</body>
</html>
